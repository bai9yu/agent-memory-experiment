<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Audit Annotation · priority20</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #5f6b7a;
      --line: #d8dee8;
      --panel: #f7f8fb;
      --accent: #1f6feb;
      --ok: #0a7f45;
      --warn: #a15c00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button {
      min-height: 36px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px;
    }
    .progress {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .metric {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .metric strong {
      display: block;
      font-size: 20px;
      margin-bottom: 2px;
    }
    .metric span {
      color: var(--muted);
      font-size: 12px;
    }
    .item {
      border-top: 1px solid var(--line);
      padding: 18px 0;
    }
    .item:first-of-type {
      border-top: 0;
    }
    .item-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }
    .box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      min-height: 118px;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .text {
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .form {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
      align-items: end;
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    select, input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 34px;
      padding: 7px 8px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    textarea {
      min-height: 72px;
      resize: vertical;
    }
    .wide {
      grid-column: span 2;
    }
    .complete .item-title h2::after {
      content: "已填";
      margin-left: 8px;
      color: var(--ok);
      font-size: 12px;
    }
    .incomplete .item-title h2::after {
      content: "待填";
      margin-left: 8px;
      color: var(--warn);
      font-size: 12px;
    }
    h2 {
      margin: 0;
      font-size: 16px;
    }
    @media (max-width: 860px) {
      header { align-items: flex-start; flex-direction: column; }
      .controls { justify-content: flex-start; }
      .progress { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .grid, .form { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
    }
  </style>
</head>

avorite basketball game was when his team was down 10 in the 4th and he hit a buzzer-beater shot to win.", "gold_memory_ids": "llm_01494", "gold_memory_types": "event", "gold_memory_texts": "John visited a canyon two days ago to be alone with nature.", "human_manual_reason": "", "human_auto_reason_correct": "", "human_top_memory_relevant": "", "human_gold_memory_sufficient": "", "human_auditor_notes": ""}, {"review_order": "18", "audit_id": "audit_040", "query_id": "q01164", "query": "Does James live in Connecticut?", "query_type": "3", "auto_reason": "memory_type_mismatch", "first_rank": "10", "top_memory_id": "llm_01716", "top_memory_type": "relationship", "top_memory_text": "James and Samantha have decided to move in together.", "gold_memory_ids": "llm_01482|llm_01483", "gold_memory_types": "event|family", "gold_memory_texts": "James adopted a puppy from a shelter in Stamford last week and named it Ned. || James has a dog named Ned.", "human_manual_reason": "", "human_auto_reason_correct": "", "human_top_memory_relevant": "", "human_gold_memory_sufficient": "", "human_auditor_notes": ""}, {"review_order": "19", "audit_id": "audit_009", "query_id": "q00889", "query": "What does Tim have that serves as a reminder of hard work and is his prized possession?", "query_type": "4", "auto_reason": "career_education_neighbor", "first_rank": "13", "top_memory_id": "llm_01062", "top_memory_type": "hobby", "top_memory_text": "Tim enjoys reading and does it as usual.", "gold_memory_ids": "llm_01050", "gold_memory_types": "hobby", "gold_memory_texts": "Tim owns a basketball signed by his favorite player, LeBron James.", "human_manual_reason": "", "human_auto_reason_correct": "", "human_top_memory_relevant": "", "human_gold_memory_sufficient": "", "human_auditor_notes": ""}, {"review_order": "20", "audit_id": "audit_006", "query_id": "q00028", "query": "Would Caroline pursue writing as a career option?", "query_type": "3", "auto_reason": "career_education_neighbor", "first_rank"     const humanFields = ["human_manual_reason", "human_auto_reason_correct", "human_top_memory_relevant", "human_gold_memory_sufficient", "human_auditor_notes"];

    function cell(value) {
      return String(value ?? "");
    }

    function isComplete(row) {
      return humanFields.every((field) => cell(row[field]).trim().length > 0);
    }

    function escapeHtml(value) {
      return cell(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function fieldId(rowIndex, field) {
      return `row_${rowIndex}_${field}`;
    }

    function renderItems() {
      const items = document.getElementById("items");
      items.innerHTML = rows.map((row, idx) => `

              <span class="badge">first rank ${escapeHtml(row.first_rank)}</span>
              <span class="badge">auto ${escapeHtml(row.auto_reason)}</span>
            </div>
          </div>
          <div class="grid">
            <div class="box">
              <div class="label">Query</div>
              <div class="text">${escapeHtml(row.query)}</div>
            </div>
            <div class="box">
              <div class="label">Top Memory · ${escapeHtml(row.top_memory_id)} · ${escapeHtml(row.top_memory_type)}</div>
              <div class="text">${escapeHtml(row.top_memory_text)}</div>

            <div class="box">
              <div class="label">Gold Memory · ${escapeHtml(row.gold_memory_ids)} · ${escapeHtml(row.gold_memory_types)}</div>

              <div class="label">Human Labels</div>
              <div class="form">

                    <option value=""></option>
<option value="memory_type_mismatch">memory_type_mismatch</option>
<option value="time_mismatch">time_mismatch</option>
<option value="entity_mismatch">entity_mismatch</option>
<option value="under_specific">under_specific</option>
<option value="multi_evidence_missing">multi_evidence_missing</option>
<option value="retrieval_noise">retrieval_noise</option>
<option value="query_ambiguous">query_ambiguous</option>
<option value="other">other</option>
                  </select>
                </label>
                <label>Auto reason correct
                  <select id="${fieldId(idx, "human_auto_reason_correct")}" onchange="updateField(${idx}, 'human_auto_reason_correct', this.value)">
                    <option value=""></option>
<option value="yes">yes</option>
<option value="partial">partial</option>
<option value="no">no</option>
                  </select>
                </label>
                <label>Top memory relevant
                  <select id="${fieldId(idx, "human_top_memory_relevant")}" onchange="updateField(${idx}, 'human_top_memory_relevant', this.value)">
                    <option value=""></option>
<option value="yes">yes</option>
<option value="partial">partial</option>
<option value="no">no</option>
                  </select>
                </label>
                <label>Gold memory sufficient
                  <select id="${fieldId(idx, "human_gold_memory_sufficient")}" onchange="updateField(${idx}, 'human_gold_memory_sufficient', this.value)">
                    <option value=""></option>
<option value="yes">yes</option>
<option value="no">no</option>
<option value="unclear">unclear</option>
                  </select>
                </label>
                <label class="wide">Auditor notes
                  <textarea id="${fieldId(idx, "human_auditor_notes")}" oninput="updateField(${idx}, 'human_auditor_notes', this.value)"></textarea>
                </label>
              </div>
            </div>
          </div>
        </article>
      `).join("");
      rows.forEach((row, idx) => {
        humanFields.forEach((field) => {
          const element = document.getElementById(fieldId(idx, field));
          if (element) element.value = cell(row[field]);
        });
      });
      updateProgress();
    }

    function updateField(index, field, value) {
      rows[index][field] = value;
      const item = document.getElementById(`item_${index}`);
      item.classList.toggle("complete", isComplete(rows[index]));
      item.classList.toggle("incomplete", !isComplete(rows[index]));
      updateProgress();
    }

    function updateProgress() {
      const done = rows.filter(isComplete).length;
      const total = rows.length;
      document.getElementById("doneCount").textContent = done;
      document.getElementById("missingCount").textContent = total - done;
      document.getElementById("percentDone").textContent = total ? `${Math.round(done / total * 100)}%` : "0%";
    }

    function showIncomplete() {
      const index = rows.findIndex((row) => !isComplete(row));
      const target = document.getElementById(`item_${index < 0 ? 0 : index}`);
      if (target) target.scrollIntoView({behavior: "smooth", block: "start"});
    }

    function csvEscape(value) {
      const text = cell(value);
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function downloadCsv() {
      const headers = Object.keys(rows[0] || {});
      const csv = [headers.join(","), ...rows.map((row) => headers.map((h) => csvEscape(row[h])).join(","))].join("\n");
      const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = outputFilename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    renderItems();
  </script>
</body>
</html>
